<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AMP · Warehouse 3D</title><link rel="stylesheet" href="style.css?v=37"></head><body>
<main class="map-shell">
 <div class="topbar"><button id="return-order" type="button" hidden>← К заказу</button><form id="search-form"><label class="sr-only" for="search">Адрес или артикул</label><span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span><input id="search" placeholder="Артикул, название или адрес" autocomplete="off" enterkeyhint="search"><button class="primary" type="submit">Найти</button></form><section class="syncbar" aria-label="Синхронизация Warehouse Map"><div class="sync-copy"><strong id="sync-status" role="status">Подключение к Warehouse Map…</strong><small id="sync-detail">Данные доступны после входа через Google.</small></div><div class="sync-buttons"><button id="login" type="button" hidden>Войти через Google</button><button id="logout" type="button" hidden>Выйти</button><button id="retry-sync" type="button" hidden>Повторить</button></div></section><span id="stock-badge" class="stock-count">450 ячеек</span></div>
 <section id="result-panel" aria-label="Результаты поиска" hidden>
  <div class="result-head"><div class="result-heading"><strong id="address">Не выбрана</strong><span id="result-count"></span></div><button id="result-expand" type="button" aria-expanded="false" aria-controls="result-detail">Товары ▾</button><button id="clear-selection" type="button" aria-label="Закрыть результаты">×</button></div>
  <div id="results" hidden></div>
  <div class="result-actions"><button id="show-cell" type="button" disabled>Показать ячейку</button><button id="clear-route" type="button" hidden>Убрать маршрут</button><span id="origin-info"></span></div>
  <div id="result-detail" hidden><p id="detail">Нажмите на ячейку или найдите её по адресу.</p></div>
  <p id="message" role="status"></p>
 </section>
 <section class="workspace"><div id="stage"><canvas id="gl" aria-label="Интерактивная 3D-модель склада"></canvas><div id="labels" role="group" aria-label="Точки навигации на 3D-карте"></div><div class="legend"><span><i class="empty"></i> Ячейка</span><span><i class="stock"></i> Занята</span><span><i class="selected"></i> Выбрана</span></div><div class="map-tools"><div class="tools"><button id="overview">Обзор</button><button id="top">Сверху</button><button id="minus" aria-label="Отдалить">−</button><button id="plus" aria-label="Приблизить">+</button></div></div><div id="route-overlay"><small id="route-caption" role="status">Выберите S1–S5</small><div class="route-start"><label for="route-origin">Откуда</label><select id="route-origin" aria-label="Начальная улица"><option value="">Улица…</option><option value="S1">S1</option><option value="S2">S2</option><option value="S3">S3</option><option value="S4">S4</option><option value="S5">S5</option></select></div><button id="route-cell" class="primary" type="button" disabled>▶ В путь</button><div class="walk-speed-control"><label for="walk-speed">Скорость</label><select id="walk-speed" aria-label="Скорость ходьбы камеры"><option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1">1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option><option value="3" selected>3×</option></select></div></div><div id="hint">1 палец — вращение · 2 пальца — сдвиг · щипок — зум · скручивание — поворот</div><div id="error" hidden></div></div></section>
</main><script src="order-return.js?v=37"></script><script src="layout.js?v=37"></script><script src="touch-controls.js?v=37"></script><script src="app.js?v=37"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script src="inventory-sync.js?v=37"></script></body></html>
