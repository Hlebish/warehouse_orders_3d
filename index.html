<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AMP · Warehouse 3D</title><link rel="stylesheet" href="style.css?v=13"></head><body>
<main class="map-shell">
 <div class="topbar"><form id="search-form"><label class="sr-only" for="search">Адрес или артикул</label><input id="search" placeholder="S3, K7 или артикул" autocomplete="off"><button class="primary" type="submit">Найти</button></form><section class="syncbar" aria-label="Синхронизация Warehouse Map"><div class="sync-copy"><strong id="sync-status" role="status">Подключение к Warehouse Map…</strong><small id="sync-detail">Данные доступны после входа через Google.</small></div><div class="sync-buttons"><button id="login" type="button" hidden>Войти через Google</button><button id="logout" type="button" hidden>Выйти</button><button id="retry-sync" type="button" hidden>Повторить</button></div></section><span id="stock-badge" class="stock-count">450 ячеек</span></div>
 <section id="result-panel" aria-label="Результаты поиска" hidden>
  <div class="result-head"><div class="result-heading"><strong id="address">Не выбрана</strong><span id="result-count"></span></div><button id="result-expand" type="button" aria-expanded="false" aria-controls="result-detail">Товары ▾</button><button id="clear-selection" type="button" aria-label="Закрыть результаты">×</button></div>
  <div id="results" hidden></div>
  <div class="result-actions"><button id="show-cell" type="button" disabled>Показать ячейку</button><button id="clear-route" type="button" hidden>Убрать маршрут</button><span id="origin-info"></span></div>
  <div id="result-detail" hidden><p id="detail">Нажмите на ячейку или найдите её по адресу.</p></div>
  <p id="message" role="status"></p>
 </section>
 <section class="workspace"><div id="stage"><canvas id="gl" aria-label="Интерактивная 3D-модель склада"></canvas><div id="labels" role="group" aria-label="Точки навигации на 3D-карте"></div><div class="legend"><span><i class="empty"></i> Ячейка</span><span><i class="stock"></i> Занята</span><span><i class="selected"></i> Выбрана</span></div><section id="minimap" class="collapsed" aria-label="Мини-карта склада"><button class="minihead" id="mini-toggle" type="button" aria-expanded="false" aria-controls="mini-body" aria-label="Развернуть мини-карту"><span>Мини-карта</span><span id="mini-chevron" aria-hidden="true">+</span></button><div id="mini-body" hidden><div id="mini-plane"><svg id="mini-svg" viewBox="0 0 340 250" aria-hidden="true"></svg><div id="mini-pins"></div></div><div id="mini-special" aria-label="Дополнительные точки"></div><div id="mini-origin">Откуда: выберите S1–S5</div></div></section><div class="map-tools"><div class="tools"><button id="overview">Обзор</button><button id="top">Сверху</button><button id="minus" aria-label="Отдалить">−</button><button id="plus" aria-label="Приблизить">+</button><button id="gesture-mode" type="button" aria-pressed="false" title="Переключить движение двух пальцев между сдвигом и поворотом с наклоном">2 пальца: сдвиг</button></div></div><div id="ghost-info" hidden></div><div id="route-overlay"><small id="route-caption" role="status">Выберите S1–S5</small><button id="route-cell" class="primary" type="button" disabled>Проложить путь</button></div><div id="hint">2 пальца — сдвиг, скручивание — поворот, щипок — зум</div><div id="error" hidden></div></div></section>
</main><script src="layout.js?v=13"></script><script src="app.js?v=13"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script src="inventory-sync.js?v=13"></script></body></html>
