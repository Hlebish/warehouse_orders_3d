<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AMP · Warehouse 3D</title><link rel="stylesheet" href="style.css?v=60"></head><body>
<main class="map-shell">
 <div class="topbar"><button id="return-order" type="button" hidden>← К заказу</button><form id="search-form"><label class="sr-only" for="search">Адрес или артикул</label><span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span><input id="search" placeholder="Артикул, название или адрес" autocomplete="off" enterkeyhint="search" maxlength="120" spellcheck="false" autocapitalize="off"><button id="reset-search" type="button" aria-label="Очистить поиск" hidden>×</button><button class="primary" type="submit">Найти</button></form><section class="syncbar" aria-label="Синхронизация Warehouse Map"><div class="sync-copy"><strong id="sync-status" role="status">Подключение к Warehouse Map…</strong><small id="sync-detail">Данные доступны после входа через Google.</small></div><div class="sync-buttons"><button id="login" type="button" hidden>Войти через Google</button><button id="logout" type="button" hidden>Выйти</button><button id="retry-sync" type="button" hidden>Повторить</button></div></section><span id="stock-badge" class="stock-count">423 ячейки</span></div>
 <section class="workspace"><div id="stage"><canvas id="gl" aria-label="Интерактивная 3D-модель склада"></canvas><div id="labels" role="group" aria-label="Точки навигации на 3D-карте"></div><section id="result-panel" aria-label="Результаты поиска" hidden><div class="search-result-head"><span id="result-count"></span><button id="toggle-results" type="button" aria-controls="results" aria-expanded="false" hidden>Адреса</button><button id="clear-selection" type="button" aria-label="Очистить поиск">×</button></div><div id="results" hidden></div><p id="message" role="status"></p></section><div class="legend"><span><i class="empty"></i> Ячейка</span><span><i class="stock"></i> Занята</span><span><i class="selected"></i> Выбрана</span></div><div class="map-tools"><div class="tools"><button id="overview">Обзор</button><button id="top">Сверху</button><button id="minus" aria-label="Отдалить">−</button><button id="plus" aria-label="Приблизить">+</button><button id="edit-mode" type="button" aria-label="Режим редактирования полок" aria-pressed="false">Ред.</button></div></div><div id="route-overlay"><div class="route-caption-row"><small id="route-caption" role="status">Выберите S1–S5</small><button id="focus-cell" type="button" aria-label="Показать выбранную ячейку крупно" title="К выбранной ячейке" hidden>Цель</button><button id="restore-cell" type="button" title="Вернуть последнюю ячейку" hidden></button></div><div class="route-start"><label for="route-origin">Откуда</label><select id="route-origin" aria-label="Начальная улица"><option value="">Улица…</option><option value="S1">S1</option><option value="S2">S2</option><option value="S3">S3</option><option value="S4">S4</option><option value="S5">S5</option></select></div><small id="route-distance" hidden></small><div id="article-fallback" aria-label="Артикулы выбранной ячейки" hidden></div><progress id="route-progress" max="100" value="0" aria-label="Прогресс маршрута" hidden></progress><button id="route-cell" class="primary" type="button" disabled>▶ В путь</button><button id="clear-route" type="button" hidden>Убрать маршрут</button><div class="walk-speed-control"><label for="walk-speed">Скорость</label><select id="walk-speed" aria-label="Скорость условного движения по маршруту"><option value="0.5">0,5×</option><option value="0.75">0,75×</option><option value="1">1×</option><option value="1.25">1,25×</option><option value="1.5">1,5×</option><option value="2">2×</option><option value="3" selected>3×</option></select></div></div><section id="edit-panel" hidden aria-label="Редактирование полок"><div class="edit-head"><strong id="edit-address">Выберите ячейку</strong><button id="edit-focus" type="button" aria-label="Приблизить редактируемую ячейку">Цель</button></div><small id="edit-current" hidden></small><div class="edit-pair"><button id="edit-upper" type="button">+ сверху</button><button id="edit-lower" type="button">+ снизу</button></div><div class="edit-models"><button id="edit-shelf" type="button">Полка</button><button id="edit-wing" type="button">Крылья · 1</button><button id="edit-hood" type="button">Капоты · 2</button><button id="edit-piston" type="button">Поршни · 1</button><button id="edit-bumper" type="button">Бамперы · 1</button><button id="edit-headlight" type="button">Фары · 1 ряд</button><button id="edit-headlight-double" type="button">Фары · 2 ряда</button><button id="edit-wing-repair" style="grid-column:1/-1" type="button" title="Стопка стальных панелей на напольном поддоне">Ремкомплекты крыла</button><button id="edit-reset" type="button">Разделить / сброс</button></div><small id="edit-help"></small><small id="edit-status" role="status"></small><div class="edit-pair"><button id="design-publish" type="button" disabled>В облако</button><button id="design-load" type="button" disabled>Из облака</button></div><small id="design-sync-status" role="status">Схема хранится на устройстве.</small><div class="edit-pair"><button id="design-transfer" type="button">Код схемы</button><button id="design-import" type="button">Импорт кода</button></div><textarea id="design-code" hidden rows="3" aria-label="Код схемы полок"></textarea></section><div id="hint">1 палец — вращение · 2 пальца — сдвиг · щипок — зум · скручивание — поворот</div><div id="error" hidden></div></div></section>
</main><script src="order-return.js?v=59"></script><script src="layout.js?v=66"></script><script src="touch-controls.js?v=59"></script><script src="shelf-models.js?v=65"></script><script src="app.js?v=67"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script src="inventory-sync.js?v=59"></script><script src="design-sync.js?v=59"></script></body></html>
